version: "3.8"

services:
  github-release-monitor:
    build: ./app
    container_name: github-release-monitor
    restart: unless-stopped
    labels:
      - "app.version=1.0.3"
    volumes:
      - /volume1/docker/Github-Release-Monitor/data:/app/data
    environment:
      # 关闭 Python 输出缓冲，保证 docker logs 实时可见
      PYTHONUNBUFFERED: "1"
      # 监控的 GitHub 仓库，逗号分隔，例如 deepseek-ai/deepseek-harness,nginx/nginx
      GITHUB_REPOS: "deepseek-ai/deepseek-harness"
      # 检查间隔（秒），默认 600 = 10 分钟
      CHECK_INTERVAL: "600"
      # 飞书自定义机器人 Webhook 地址，形如 https://open.feishu.cn/open-apis/bot/v2/hook/xxxx
      FEISHU_WEBHOOK: ""
      # 飞书签名密钥（如无签名可留空，但建议填写）
      FEISHU_SECRET: ""
      # GitHub Token（可选，提高 API 限额，避免未认证 60 次/小时限制）
      GITHUB_TOKEN: ""
      # HTTP 代理（如需翻墙访问 GitHub 可取消注释并修改为实际地址）
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      # NO_PROXY: "localhost,127.0.0.1"
